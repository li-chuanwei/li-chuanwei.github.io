name: 部署个人主页

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      # 项目使用 pnpm 11，由官方 pnpm/setup 同时安装 Node.js 与依赖。
      - name: 安装运行环境与依赖
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建生产文件
        run: pnpm build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: 发布站点
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
